name: Release

permissions:
  contents: write

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - run: npx --yes changelogithub
        env:
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
